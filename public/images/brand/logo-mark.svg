  <path d="M32 21.5c0-3.2-.3-5.6-1.2-7.4" fill="none" stroke="#2D5A27" stroke-width="1.8" stroke-linecap="round" />
  <path d="M31.4 15.8c-3.8-3.8-8.4-2.4-8.2.8.2 2.8 4.4 3.4 8.2-.8Z" fill="#2D5A27" />
  <path d="M31.9 14.8c2.6-4.2 7.5-3.6 7.8-.4.2 2.7-3.8 3.8-7.8.4Z" fill="#2D5A27" />

  <!-- Expressive Eyes with Specular Sparkle -->
  <circle cx="26.5" cy="37.8" r="2.1" fill="#1F2421" />
  <circle cx="25.8" cy="37.1" r="0.7" fill="#FAF8F5" />
  <circle cx="37.5" cy="37.8" r="2.1" fill="#1F2421" />
  <circle cx="36.8" cy="37.1" r="0.7" fill="#FAF8F5" />

