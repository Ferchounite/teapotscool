<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Koko, the TeapotsCool Kyusu tea spirit">
  <!-- Soft Warm Rice Paper Badge -->
  <circle cx="32" cy="32" r="30" fill="#FAF8F5" stroke="#E2DDD3" stroke-width="2" />

  <!-- Gentle Steam Wisp above Spout -->
  <path d="M13 24c-1.8-2.2 1.2-4.6-.5-7" fill="none" stroke="#4E5650" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
  <path d="M17.5 21.5c-1.3-1.8 1-3.6-.3-5.4" fill="none" stroke="#2D5A27" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />

  <!-- Kyusu Side Handle (Right) -->
  <path d="M46 33c5.2-.3 9 2.6 9 6.6 0 3.7-3.3 6.2-8.2 6.4" fill="none" stroke="#C86D51" stroke-width="4.5" stroke-linecap="round" />
  <path d="M46 33c5.2-.3 9 2.6 9 6.6 0 3.7-3.3 6.2-8.2 6.4" fill="none" stroke="#9E472D" stroke-width="1.4" stroke-linecap="round" opacity="0.45" />

  <!-- Plump Spout (Left) -->
