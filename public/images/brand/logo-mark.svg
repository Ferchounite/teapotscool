  <ellipse cx="23.2" cy="40.6" rx="2.1" ry="1.2" fill="#C86D51" opacity="0.5" />
  <ellipse cx="40.8" cy="40.6" rx="2.1" ry="1.2" fill="#C86D51" opacity="0.5" />

